databases:
  - name: ask-ai-postgres
    plan: starter
    databaseName: askai
    user: askai_user

services:
  - type: web
    name: django-backend
    runtime: python
    branch: madhav-dev
    plan: starter
    buildCommand: "pip install -r django_backend/requirements.txt && python django_backend/manage.py migrate && python django_backend/manage.py collectstatic --noinput"
    startCommand: "cd django_backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ask-ai-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FASTAPI_SERVICE_URL
        sync: false
      - key: DEMO_MODE
        value: "false"

  - type: web
    name: fastapi-service
    env: docker
    dockerfilePath: fastapi_service/Dockerfile
    dockerContext: fastapi_service
    branch: madhav-dev
    plan: starter
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "qwen/qwen3.8-27b"
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: "ask-ai"
      - key: DJANGO_INTERNAL_URL
        sync: false
      - key: VECTOR_DB_URL
        fromDatabase:
          name: ask-ai-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: worker
    name: celery-worker
    env: docker
    dockerfilePath: fastapi_service/Dockerfile
    dockerContext: fastapi_service
    branch: madhav-dev
    plan: starter
    dockerCommand: "celery -A jobs.celery_app worker --loglevel=info --concurrency=2"
    envVars:
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: "ask-ai"
      - key: PII_HASH_SALT
        sync: false
